on: push

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - run: >-
          dotnet publish src/city-builder/city-builder.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish/windows

      - uses: actions/upload-artifact@v7
        with:
          path: publish/windows/
